name: WhatsApp Web Bridge Container

on:
  push:
    branches: [main]
    paths:
      - 'services/whatsapp-web-bridge/**'
      - '.github/workflows/whatsapp-web-bridge-container.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: whatsapp-web-bridge-container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/bhg-whatsapp-web-bridge
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: services/whatsapp-web-bridge
          file: services/whatsapp-web-bridge/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

      - name: Summary
        run: |
          echo '### WhatsApp Bridge image published' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '`ghcr.io/${{ github.repository_owner }}/bhg-whatsapp-web-bridge:latest`' >> "$GITHUB_STEP_SUMMARY"
